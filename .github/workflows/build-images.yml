name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/tansanmilmil/birds_eye_v3

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        run: ./backend/test.sh

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build go
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-go:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

      - name: Build nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Push images
        run: |
          for service in go nginx; do
            docker push "$IMAGE_PREFIX-$service:$GITHUB_SHA"
          done
