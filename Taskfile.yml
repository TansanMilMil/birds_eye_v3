version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  run:
    aliases: [start]
    desc: Run app locally with Docker Compose
    cmds:
      - docker compose down
      - docker compose up -d
      - docker compose exec go ./run.sh

  stop:
    cmds:
      - docker compose down

  e2e:
    desc: Run local E2E (boot all containers in PRODUCTION mode and assert health)
    deps: [build] # go/dist/birds_eye_v3 を保証 (build は test に依存)
    cmds:
      - ./scripts/e2e.sh

  test:
    desc: Run tests in Docker
    cmds:
      - ./scripts/test-docker.sh

  build:
    desc: Build binary in Docker
    deps: [test]
    cmds:
      - ./scripts/build-docker.sh

  build-frontend:
    desc: Build frontend locally
    cmds:
      - echo "==== Build frontend ===="
      - rm -rf ./frontend/dist
      - cd frontend && npm install && npm run build

  check-remote-health:
    desc: Check remote health status
    cmds:
      - ./backend/check-remote-curl.sh

  db:
    desc: Open sqlite3 shell on the running go container
    cmds:
      - docker compose exec go sqlite3 /data/birds_eye.db

  seed:
    desc: Insert mock news into the DB of the running go container (debug)
    cmds:
      - docker compose exec go go run ./go/src/cmd/seed

  scrape:
    desc: Run scrape.sh
    cmds:
      - ./backend/scrape.sh

  clean:
    desc: Clean temporary files
    cmds:
      - echo "==== Clean temporary files ===="
      - docker compose down
      - echo "Cleanup complete"
