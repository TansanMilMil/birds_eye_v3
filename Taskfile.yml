version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  run:
    cmds:
      - docker compose down
      - docker compose up -d
      - docker compose exec go ./run.sh

  stop:
    cmds:
      - docker compose down

  e2e:
    desc: Run local E2E (boot all containers in PRODUCTION mode and assert health)
    deps: [build] # go/dist/birds_eye_v3 を保証 (build は test に依存)
    cmds:
      - ./backend/scripts/e2e.sh

  test:
    desc: Run tests in Docker
    cmds:
      - echo "==== Docker compose setup ===="
      - docker compose down
      - docker compose up -d go
      - echo "==== Run all tests ===="
      - docker compose exec go ./test.sh
      - docker compose down

  build:
    desc: Build binary in Docker
    deps: [test]
    cmds:
      - echo "==== Docker compose setup ===="
      - docker compose down
      - docker compose up -d go
      - echo "==== Build ===="
      - docker compose exec go ./build.sh
      - echo "==== Docker compose teardown ===="
      - docker compose down

  build-frontend:
    desc: Build frontend locally
    cmds:
      - echo "==== Build frontend ===="
      - sudo rm -rf ./frontend/dist
      - cd frontend && npm install && npm run build

  package:
    desc: Create deployment package
    deps: [build, build-frontend]
    cmds:
      - echo "==== Create deploy package ===="
      - rm -rf ./backend/deploy-temp
      - mkdir -p ./backend/deploy-temp
      - mkdir -p ./backend/deploy-temp/backend/go
      - rsync -a --ignore-missing-args ./backend/go/dist ./backend/deploy-temp/backend/go/
      - rsync -a --ignore-missing-args ./backend/Dockerfile.prod ./backend/deploy-temp/backend/
      - rsync -a --ignore-missing-args ./docker-compose.prod.yml ./backend/deploy-temp/docker-compose.yml
      - rsync -a --ignore-missing-args ./frontend/dist ./backend/deploy-temp/frontend/
      - rsync -a --ignore-missing-args ./.env ./backend/deploy-temp/ || true
      - rsync -a --ignore-missing-args ./backend/init_db.sh ./backend/deploy-temp/
      - rsync -a --ignore-missing-args ./nginx ./backend/deploy-temp/
      - tar czf ./backend/deploy.tgz -C ./backend/deploy-temp .
      - rm -rf ./backend/deploy-temp
      - echo "Package created deploy.tgz"

  transfer:
    desc: Transfer package to remote
    deps: [package]
    vars:
      TARGET_DIR: "{{.VENUS_HOME}}/birds_eye_v3"
    cmds:
      - echo "==== Transfer to remote ===="
      - |
        if [ -z "{{.VENUS_SSH_HOST}}" ]; then
          echo "Error: VENUS_SSH_HOST is not set. Please check .env file."
          exit 1
        fi
      - |
        if [ -z "{{.VENUS_HOME}}" ]; then
          echo "Error: VENUS_HOME is not set. Please check .env file."
          exit 1
        fi
      - ssh {{.VENUS_SSH_HOST}} mkdir -p {{.TARGET_DIR}}
      - scp ./backend/deploy.tgz {{.VENUS_SSH_HOST}}:{{.TARGET_DIR}}/deploy.tgz
      - ssh {{.VENUS_SSH_HOST}} "tar xzf {{.TARGET_DIR}}/deploy.tgz -C {{.TARGET_DIR}} && rm {{.TARGET_DIR}}/deploy.tgz"
      - rm ./backend/deploy.tgz
      - echo ""
      - echo "Current files on remote:"
      - ssh {{.VENUS_SSH_HOST}} ls -alh {{.TARGET_DIR}}

  stop-remote:
    desc: Stop containers on remote
    vars:
      TARGET_DIR: "{{.VENUS_HOME}}/birds_eye_v3"
    cmds:
      - echo "==== Stop birdseyeapi on remote ===="
      - |
        if [ -z "{{.VENUS_SSH_HOST}}" ]; then
          echo "Error: VENUS_SSH_HOST is not set. Please check .env file."
          exit 1
        fi
      - ssh {{.VENUS_SSH_HOST}} "docker compose -f {{.TARGET_DIR}}/docker-compose.yml down || true"

  start-remote:
    desc: Start containers on remote
    vars:
      TARGET_DIR: "{{.VENUS_HOME}}/birds_eye_v3"
    cmds:
      - echo "==== Start birdseyeapi on remote ===="
      - |
        if [ -z "{{.VENUS_SSH_HOST}}" ]; then
          echo "Error: VENUS_SSH_HOST is not set. Please check .env file."
          exit 1
        fi
      - ssh {{.VENUS_SSH_HOST}} docker compose -f {{.TARGET_DIR}}/docker-compose.yml up -d
      - echo ""
      - echo "Waiting for 10 seconds to get the latest status..."
      - sleep 10
      - echo "Current docker containers on remote:"
      - ssh {{.VENUS_SSH_HOST}} docker ps

  init-db:
    desc: Initialize database on remote
    deps: [start-remote]
    vars:
      TARGET_DIR: "{{.VENUS_HOME}}/birds_eye_v3"
    cmds:
      - echo "==== Initialize database ===="
      - echo "Waiting for MySQL to start..."
      - sleep 5
      - ssh {{.VENUS_SSH_HOST}} {{.TARGET_DIR}}/init_db.sh

  deploy:
    desc: Full deployment (test + build + package + transfer + start)
    deps: [package]
    cmds:
      - task: stop-remote
      - task: transfer
      - task: start-remote
      - echo ""
      - echo "==== Deploy finished! ===="
      - echo ""
      - echo "==== Health check ===="
      - echo "Waiting for 20 seconds to get the latest status..."
      - sleep 20
      - task: check-remote-health

  check-remote-health:
    desc: Check remote health status
    cmds:
      - ./backend/check-remote-curl.sh

  db:
    desc: Open sqlite3 shell on the running go container
    cmds:
      - docker compose exec go sqlite3 /data/birds_eye.db

  scrape:
    desc: Run scrape.sh
    cmds:
      - ./backend/scrape.sh

  clean:
    desc: Clean temporary files
    cmds:
      - echo "==== Clean temporary files ===="
      - rm -rf ./backend/deploy-temp
      - rm -f ./backend/deploy.tgz
      - docker compose down
      - echo "Cleanup complete"
