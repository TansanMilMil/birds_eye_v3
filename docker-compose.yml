services:

  frontend:
    build:
      context: ./frontend
    container_name: birds_eye_frontend
    mem_limit: 512m
    volumes:
      - ./frontend:/project
      - /project/node_modules
      - frontend-build:/project/build
    restart: unless-stopped
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.31.2
    container_name: birds_eye_nginx
    mem_limit: 64m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/log:/var/log/nginx
      - frontend-build:/var/www/html:ro
    restart: unless-stopped
    tty: true
    ports:
      - 8082:80
    depends_on:
      - go
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "promtail"
      app_name: "nginx"

  go:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: birds_eye_go
    ports:
      - 8080:8080
    tty: true
    mem_limit: 512m
    volumes:
      - ./backend:/project
      - db-store:/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped
    working_dir: /project
    environment:
      BIRDSEYE_SELENIUM_URL: "${BIRDSEYE_SELENIUM_URL}"
      BIRDSEYE_BIRDSEYEAPI_EXECUTION_MODE: "${BIRDSEYE_BIRDSEYEAPI_EXECUTION_MODE}"
      BIRDSEYE_BIRDSEYEAPI_V2_OPENAI_API_KEY: "${BIRDSEYE_BIRDSEYEAPI_V2_OPENAI_API_KEY}"
      BIRDSEYE_BIRDSEYEAPI_V2_CLAUDE_API_KEY: "${BIRDSEYE_BIRDSEYEAPI_V2_CLAUDE_API_KEY}"
      BIRDSEYE_GO_API_PORT: "${BIRDSEYE_GO_API_PORT}"
      BIRDSEYE_AWS_CLOUDFRONT_BIRDSEYEAPIPROXY_DISTRIBUTION_ID: "${BIRDSEYE_AWS_CLOUDFRONT_BIRDSEYEAPIPROXY_DISTRIBUTION_ID}"
      BIRDSEYE_AWS_REGION: "${BIRDSEYE_AWS_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      BIRDSEYE_OPENAI_MODEL: "${BIRDSEYE_OPENAI_MODEL}"
      BIRDSEYE_OPENAI_CHAT_ENDPOINT: "${BIRDSEYE_OPENAI_CHAT_ENDPOINT}"
      BIRDSEYE_SCRAPING_ARTICLES: "${BIRDSEYE_SCRAPING_ARTICLES}"
    entrypoint: ./go-entrypoint.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "promtail"
      app_name: "go"
      ofelia.enabled: "true"
      ofelia.job-exec.scrape-news.schedule: "0 10 18 * * *"
      ofelia.job-exec.scrape-news.command: "curl -X POST http://localhost:8080/news/scrape"

  selenium:
    image: selenium/standalone-firefox:133.0
    container_name: birds_eye_selenium
    ports:
      - 4444:4444
    shm_size: 512m
    mem_limit: 1g
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "120"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "promtail"
      app_name: "selenium"

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: birds_eye_ofelia
    depends_on:
      - go
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  db-store:
  frontend-build:
  go-mod-cache:
  go-build-cache:
