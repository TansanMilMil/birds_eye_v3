services:
  nginx:
    image: ghcr.io/tansanmilmil/birds_eye_v3-nginx:${BIRDSEYE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: birds_eye_nginx
    mem_limit: 64m
    environment:
      BIRDSEYE_CLOUDFRONT_SECRET: "${BIRDSEYE_CLOUDFRONT_SECRET:-}"
    volumes:
      - ./nginx/log:/var/log/nginx
      - ${VENUS_NGINX_BLOCKLIST_DIR:-./nginx/blocklist}:/etc/nginx/blocklist:ro
    restart: unless-stopped
    tty: true
    ports:
      - 8082:80
    depends_on:
      - go
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "promtail"
      app_name: "nginx"

  go:
    image: ghcr.io/tansanmilmil/birds_eye_v3-go:${BIRDSEYE_IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: birds_eye_go
    ports:
      - 127.0.0.1:8080:8080
    tty: true
    mem_limit: 512m
    volumes:
      - db-store:/data
    restart: unless-stopped
    environment:
      BIRDSEYE_BIRDSEYEAPI_EXECUTION_MODE: "${BIRDSEYE_BIRDSEYEAPI_EXECUTION_MODE}"
      BIRDSEYE_BIRDSEYEAPI_V2_OPENAI_API_KEY: "${BIRDSEYE_BIRDSEYEAPI_V2_OPENAI_API_KEY}"
      BIRDSEYE_BIRDSEYEAPI_V2_CLAUDE_API_KEY: "${BIRDSEYE_BIRDSEYEAPI_V2_CLAUDE_API_KEY}"
      BIRDSEYE_TYPESAFE_API_KEY: "${BIRDSEYE_TYPESAFE_API_KEY}"
      BIRDSEYE_GO_API_PORT: "${BIRDSEYE_GO_API_PORT}"
      BIRDSEYE_SITE_URL: "${BIRDSEYE_SITE_URL:-}"
      BIRDSEYE_AWS_CLOUDFRONT_BIRDSEYEAPIPROXY_DISTRIBUTION_ID: "${BIRDSEYE_AWS_CLOUDFRONT_BIRDSEYEAPIPROXY_DISTRIBUTION_ID}"
      BIRDSEYE_AWS_REGION: "${BIRDSEYE_AWS_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      BIRDSEYE_OPENAI_MODEL: "${BIRDSEYE_OPENAI_MODEL}"
      BIRDSEYE_SCRAPING_ARTICLES: "${BIRDSEYE_SCRAPING_ARTICLES}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "promtail"
      app_name: "go"
      ofelia.enabled: "true"
      ofelia.job-exec.scrape-news.schedule: "0 10 18 * * *"
      ofelia.job-exec.scrape-news.command: "curl -X POST http://localhost:8080/news/scrape"

  selenium:
    image: selenium/standalone-firefox:157.0.1-20261010
    container_name: birds_eye_selenium
    ports:
      - 127.0.0.1:4444:4444
    shm_size: 512m
    mem_limit: 1g
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "120"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "promtail"
      app_name: "selenium"

  ofelia:
    image: mcuadros/ofelia:0.3.22
    container_name: birds_eye_ofelia
    depends_on:
      - go
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  db-store:
